
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # Actions tab -> "Run workflow" button

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The project has no gradlew / gradle-wrapper.jar, so install the exact
      # Gradle version from gradle-wrapper.properties and call `gradle` directly.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # Make sure the Android SDK licenses are accepted so AGP can auto-download
      # any missing platform / build-tools (e.g. compileSdk 36.1).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # app/build.gradle.kts signs the debug build with ${rootDir}/debug.keystore,
      # and that file is in .gitignore, so create it on the fly.
      - name: Create debug keystore
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mitra-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Non-blocking: a failing/slow Robolectric download will not hide the APK above.
      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
